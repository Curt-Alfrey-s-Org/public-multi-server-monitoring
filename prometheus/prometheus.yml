# Public snapshot -- remote targets via file_sd_configs only.
# https://prometheus.io/docs/prometheus/latest/configuration/configuration/

global:
  scrape_interval: 10s
  scrape_timeout: 9s
  evaluation_interval: 10s
  external_labels:
    monitor: example

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 127.0.0.1:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090

  - job_name: remote-exporters
    file_sd_configs:
      - files:
          - /etc/prometheus/scrape-targets.yml
        refresh_interval: 30s
